name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src main.py cli rag

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt mypy
      - run: mypy src main.py cli rag

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest

  frozen-step35-acceptance:
    name: Acceptance (frozen Step 3.5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_frozen_step35_acceptance.py

  blender-render:
    name: Test (blender_render)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLENDER_ARCHIVE: blender-4.2.23-linux-x64.tar.xz
      BLENDER_SHA256: bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: Install Blender system libraries
        run: sudo apt-get update && sudo apt-get install -y libxrender1 libxi6 libxkbcommon0 libsm6 libgl1
      - name: Install verified Blender 4.2 LTS
        run: |
          curl --fail --location --silent --show-error \
            --output "$BLENDER_ARCHIVE" \
            "https://download.blender.org/release/Blender4.2/$BLENDER_ARCHIVE"
          echo "$BLENDER_SHA256  $BLENDER_ARCHIVE" | sha256sum --check --strict
          tar -xf "$BLENDER_ARCHIVE"
          echo "${PWD}/${BLENDER_ARCHIVE%.tar.xz}" >> "$GITHUB_PATH"
      - run: blender --version
      - run: pytest -m blender_render
