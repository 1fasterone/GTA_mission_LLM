name: Generated C# checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csharp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generated-csharp:
    name: Generated C# (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - run: pip install -r requirements.txt pytest
      - name: Build C# controls and check generated micro syntax
        run: python -m tools.ci_semantic_probe
      - name: Run C# syntax-gate regressions
        run: python -m pytest -q tests/test_csharp_syntax_gate.py
