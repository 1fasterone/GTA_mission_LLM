name: Generated C# Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-csharp:
    name: Generated C# (dotnet build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.0.x"
      - run: pip install -r requirements.txt pytest
      - name: Build the Roslyn generation gate
        run: dotnet build tools/csharp_syntax_gate/SyntaxGate.csproj --configuration Release
      - name: Exercise generated C# binding guards
        run: >-
          pytest -q
          tests/test_csharp_syntax_gate.py
          tests/test_unity_api_surface.py
          tests/test_outputs_smoke.py
          tests/test_authored_code_binding.py
