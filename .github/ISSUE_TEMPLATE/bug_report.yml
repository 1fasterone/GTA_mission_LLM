name: Bug report
description: Report a reproducible compiler, generator, or runtime defect
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities or exposed credentials here. Use the private security-reporting link in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The output of `git rev-parse HEAD`.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the exact command, input provenance, configuration differences, and minimal steps.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and artifacts
      description: Attach the relevant run log, schema, traceback, or Unity/GTA runtime evidence. Remove secrets and personal paths where appropriate.
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - Unity
        - GTA V
        - Shared compiler
        - Web UI
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I did not hand-author or pre-format pipeline output and present it as an eval result.
          required: true
