version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    # requirements.txt uses compatible lower bounds. Do not raise a lower
    # bound merely because a newer release exists; update a resolved version
    # or constraint only when the current requirement excludes the update.
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
