[pytest]
markers =
    smoke: runs against real generated outputs under output/ and output/unity/ (beta gate)
    unity_compile: launches the real Unity Editor in batchmode to compile-check a generated project (slow, opt-in)
    unity_playtest: launches the real Unity Editor in batchmode to run a PlayMode smoke test (Unity Test Framework — console errors, avatar cardinality, entity spawn counts) against a generated project (slow, opt-in)
    integration: needs a built RAG index plus the embedding model; skips itself when either is missing
    playability: replays the evals/playability cases through Steps 4-6 and gates each against its locked floor (~1s per case, no LLM/Unity/network)
    blender_render: launches headless Blender to actually build a generated model and check for real mesh errors (bmesh op mismatches, non-manifold geometry) that compile()-only checks can't see (slow, opt-in)
testpaths = tests
# The unity_compile / unity_playtest / blender_render gates spin up a real
# Unity Editor / Blender process (slow); keep them out of the default run.
# Opt in explicitly with `pytest -m unity_compile`, `-m unity_playtest`, or
# `-m blender_render`. An explicit `-m` on the CLI overrides this default.
addopts = -m "not unity_compile and not unity_playtest and not blender_render"
