[pytest]
markers =
    smoke: runs against real generated outputs under output/ and output/unity/ (beta gate)
    unity_compile: launches the real Unity Editor in batchmode to compile-check a generated project (slow, opt-in)
    integration: needs a built RAG index plus the embedding model; skips itself when either is missing
testpaths = tests
# The unity_compile gate spins up a real Unity Editor (minutes); keep it out of
# the default run. Opt in explicitly with `pytest -m unity_compile`. An explicit
# `-m` on the CLI overrides this default.
addopts = -m "not unity_compile"
