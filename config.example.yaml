lm_studio:
  backend: lm_studio              # "lm_studio" or "ollama"
  base_url: http://localhost:1234/v1
  model: qwen3.5-9b               # the model name shown in LM Studio
  temperature: 0.7
  max_tokens: 8192
  timeout: 600
  concept_temperature: 0.85
  schema_temperature: 0.2
  # Reasoning effort for the steps that reason (concept). "none" | "minimal" |
  # "low" | "high". Mechanical steps always send "none"; --no-think forces
  # "none" everywhere. LM Studio honours only this field for the toggle.
  reasoning_effort: high
  # seed: 1234                     # fixed sampler seed → reproducible LLM output (unset = random)
  # Step-3 schema-fill request enforcement — never used for concept generation
  # (which expects prose). A server/model that rejects either falls back to
  # today's prompt-and-repair behavior automatically (src/lm_studio_client.py).
  structured_output: false        # true = response_format json_object (valid JSON syntax only)
  # off | json_object | json_schema — tri-state successor to structured_output
  # above; json_schema asks for real SHAPE-constrained decoding against
  # UnitySchema's own derived JSON Schema (src/unity_schema_jsonschema.py), not
  # just valid syntax. json_schema is NOT RECOMMENDED: live-verified
  # (2026-09-02) against qwythos-9b with the REAL Step 3 prompt at the real
  # 50k max_tokens budget, 3/3 trials came back with entities: [] (the
  # brief's actual collectibles/enemies never got generated) and failed the
  # playability gate every time — see docs/COMPILER_AUDIT.md Gap A for the
  # full writeup and suspected cause. Left wired for whoever root-causes it,
  # not because it's usable today. Leave unset to read structured_output above
  # unchanged (json_object mode has none of this problem).
  # structured_output_mode: json_schema

ollama:                            # used when lm_studio.backend == "ollama"
  base_url: http://localhost:11434/v1
  model: qwen2.5:7b               # must match a pulled tag (ollama pull <model>)

# Used when lm_studio.backend == "openrouter" (see src/backends.py). Cloud, so
# it sidesteps the local card's VRAM contention with ComfyUI / Stable Audio 3,
# and puts models far larger than a local 9B on the Step 2/3 content steps —
# which is what the vfx/materials/shaders sections of a rich brief actually
# need. Needs OPENROUTER_API (or OPENROUTER_API_KEY) in .env; make_chat_client
# abstains loudly if the key is missing rather than silently falling back.
#
# Free-tier notes, all measured live (2026-08-29) against this repo's real
# Step 2/3 prompts, which run ~11k prompt tokens:
#   * A ":free" model's ADVERTISED context is not a promise. OpenRouter lists
#     nvidia/nemotron-3-ultra-550b-a55b:free at 1,000,000 tokens, and a short
#     request works — but the real Step 3 prompt comes back in under a second
#     as HTTP 404 "Provider returned error" with an empty body. Always probe a
#     candidate model at the real prompt size before trusting it.
#   * minimax/minimax-m3:free took the same prompt in 6.7s and completed a full
#     --compose run (concept, schema, ~25 micro-code calls).
#   * The free-model allowance is per ACCOUNT, not per model: without purchased
#     credits it is 50 requests/day, and one --compose --micro-code run spends
#     most of that. Past it, every free model 429s with
#     "Rate limit exceeded: free-models-per-day".
#   * Upstream providers rotate and can fail mid-run (a 402 "Insufficient
#     balance" from one provider killed a 40-minute run). LMStudioClient now
#     retries provider-transient statuses three times with backoff.
openrouter:
  base_url: https://openrouter.ai/api/v1
  model: minimax/minimax-m3:free
  timeout: 600                    # a cloud queue absorbs more latency than a local server
  # api_key: ''                   # DO NOT commit a real key — OPENROUTER_API wins
  # seed: 1234

rag:
  fallback_to_local: true         # use bundled local lookups when RAG misses
  # index_dir: rag/index           # optional override for ChromaDB path (default: rag/index/)

basic_mode: false                  # true => skip RAG entirely; local lookups only

pipeline:
  output_dir: output
  lookups_dir: lookups
  template_file: templates/mission.cs.j2
  minigame_template_file: templates/minigame.cs.j2

unity_pipeline:
  lookups_dir: lookups
  unity_template_dir: templates/unity
  unity_output_dir: output/unity
  # Inject the MCP-for-Unity editor bridge (com.coplaydev.unity-mcp) into every
  # generated full project so an agent can fix the first-open compile errors.
  # Dev-only; set false for distribution/build outputs.
  inject_mcp_bridge: true
  # Step-3 multimodal IR ask (src/unity_prompts.py). The core sections
  # (capabilities/characters/missions/audio_specs) always ship; this caps how
  # many CONTENT-gated extras (dialog/behavior_trees/animations/vfx/surfaces/
  # sequence) ride along, ~150 tokens each. Lower it on a tight context window.
  multimodal_max_sections: 3
  # Unity package cache (src/unity_package_cache.py). On first open Unity
  # resolves every registry package in manifest.json against packages.unity.com
  # and downloads it — a network stall repeated for every generated project even
  # though the bytes never change. Filling a local cache once and copying it
  # into Unity's GLOBAL cache (%LOCALAPPDATA%\Unity\cache) makes that a no-op.
  #
  # Only registry packages are involved. The 30 com.unity.modules.* built-ins
  # and the editor-bundled SRP/UI packages (URP, shadergraph, ugui, ui — the
  # public registry stops at 8.3.1; Unity 6 resolves 17.x from the editor
  # install) are never downloaded, so they are skipped.
  package_cache:
    enabled: true
    # Local cache. Filled once by `python main.py unity-package-cache fill`,
    # then reused by every later project. Regenerable and gitignored — safe to
    # delete any time. Budget ~1.4 GB for the default feature set (measured).
    dir: cache/unity_packages
    # Whether a BUILD may download. Default false on purpose: `unity-create`
    # must never turn into a surprise multi-gigabyte fetch mid-run. The hook
    # still primes whatever the local cache already holds, so the workflow is
    # "fill once, benefit on every later project".
    #   python main.py unity-package-cache status   # what's cached
    #   python main.py unity-package-cache fill     # download (one time)
    download: false
    # Emit Packages/packages-lock.json pinning the resolved graph. The cache
    # stops the DOWNLOAD; the lock file stops the REGISTRY RESOLUTION that
    # precedes it. Both are needed for a genuinely offline first open.
    write_lock: true
    # Unity's global cache root. Empty = auto-detect, honoring Unity's own
    # UPM_CACHE_ROOT override when it is set.
    # global_root: ''

playability:
  # Pipeline Step 7 (src/unity_playability.py) grades every build on whether
  # it is actually a GAME — the player has an avatar, a controller, an
  # objective, reachable content, and the entities the brief named explicitly
  # survived. The scorecard always prints and is written to the project as
  # playability.txt; these two switches decide whether it can FAIL a build.
  #
  # gate: true makes any playability ERROR fatal (FAIL-FAST doctrine). Left
  # false by default so switching the evaluator on doesn't start failing
  # existing projects with known findings.
  gate: false
  # Also fail below this 0-100 weighted score. 0 disables the threshold.
  #
  # Read the score next to the scorecard's "not graded" line, never alone: it is
  # the weighted share of the checks that COULD be graded, and a mid-pipeline
  # schema legitimately lacks the evidence some of them need. The regression gate
  # is `python main.py unity-eval` / `pytest -m playability`, which replays
  # captured schemas against locked per-case floors and additionally fails when
  # an ERROR-class check stops being gradable at all (see docs/TESTING.md A1).
  min_score: 0

assets:
  # FAIL-FAST doctrine (no generic defaults): every scene entity must resolve
  # to a REAL model — an explicit kind in the default pack
  # (lookups/unity/default_models.json + Models/Defaults), a semantic match in
  # the full asset catalog, or a Blender-built FBX. When strict, an entity
  # matching nothing HARD-FAILS the build with the query tokens + near misses
  # instead of silently spawning one shared prop. Give entities a model_hint,
  # extend the library, or set false only for throwaway WIP.
  strict: true
  # Asset library roots scanned by `python main.py unity-catalog` into
  # lookups/unity/asset_catalog.json (regenerate after adding packs).
  roots: ["Models/FBX format"]
  # 2D sprite roots (PNG). Sprites are preferred over 3D models for 2D games;
  # the spawner builds Sprites at runtime, so no import settings needed.
  sprite_roots: ["Models/FishPack/PNG/Default", "Models/2d-space-kit", "Models/space-shooter-pack/PNG", "Models/space-shooter-remastered/PNG"]
  # Minimum keyword-overlap score for a catalog match (0.0-1.0-ish scale).
  min_match_score: 0.15
  # Same-kind entity groups rotate among the top-K near-equal matches so a
  # forest isn't 5 copies of the same tree. Deterministic (schema order).
  # Only consulted when sample_temperature is 0 (see below).
  variety_top_k: 5
  # ── Distribution sampling ────────────────────────────────────────────────
  # "Pick the best match" (above) only ever surfaces the handful of top-scored
  # models, which is why a multi-thousand-asset catalog keeps showing the same
  # ~20 files. Set sample_temperature > 0 to instead score every candidate,
  # normalize the top `sample_pool` scores into a softmax distribution, and
  # SAMPLE from it.
  #   0.0        → disabled: the historical best-match + rotation, byte-for-byte
  #   0.25-0.5   → recommended: real variety, still strongly on-concept
  #   >= 1.0     → very flat; off-concept matches start winning slots
  # Reproducible, not random: picks are drawn from a SEEDED RNG, so the same
  # schema + same sample_seed always produces the same project. Change
  # sample_seed to get a different — but equally repeatable — cast of models.
  sample_temperature: 0.0
  sample_pool: 40          # how many top-scored candidates enter the distribution
  sample_seed: 0           # change for a different reproducible draw

sketchfab:
  # Live Sketchfab model search — a Tier S the resolver tries BEFORE the
  # Kenney catalog tiers (src/unity_entity_asset_resolver.py). Frozen-artifact
  # pattern: search/download/convert is nondeterministic, but its output is
  # frozen to lookups/unity/sketchfab_catalog.json and read back as a plain,
  # deterministic lookup — see docs/model-pipeline-architecture.md.
  #
  # Requires `pip install playwright && playwright install chromium` — a
  # real headless Chromium is the transport (not httpx/requests): Sketchfab's
  # API sits behind AWS WAF Bot Control that fingerprints plain HTTP clients'
  # TLS handshake, and only an actual Chromium instance clears it.
  enabled: false                 # master switch; false = Kenney-only, untouched
  api_token: ''                  # DO NOT commit a real token — SKETCHFAB_API_TOKEN
                                  # env var always wins over this
  base_url: https://api.sketchfab.com/v3
  timeout: 30                    # search / get_download_urls — small JSON calls
  download_timeout: 240          # the archive fetch itself — transfer speed to
                                  # Sketchfab's S3 bucket is variable (measured
                                  # 25MB in ~31s, 70MB in ~102s minutes apart)
  accepted_licenses: ['cc0', 'by', 'by-sa', 'by-nd']   # Sketchfab v3 license slugs
  auto_fetch: false              # false = `python main.py sketchfab-fetch` pre-populates
                                  #         the cache manually; resolver stays a pure lookup.
                                  # true  = resolver live-fetches on a cache miss —
                                  #         nondeterministic on the first hit for a new
                                  #         concept, frozen/idempotent from then on.
  min_match_score: 0.15          # same scale as assets.min_match_score
  cache_dir: Models/Sketchfab    # converted FBX + Textures/ + manifest live here
  blender_path: ''                # empty => reuse blender.blender_path / auto-detect

blender:                           # external asset-fulfilment stage (blender_cli.py)
  blender_path: ''                 # empty => auto-detect (PATH + standard installs)
  output_dir: output/blender
  timeout: 900                     # seconds per Blender job
  max_retries: 1                   # extra attempts before a job is marked FAILED
  normalize_exports: true          # strip FBX/Alembic timestamps -> byte-identical re-exports
  diffusion:                       # second pipeline for non-procedural textures
    backend: none                  # none | auto1111 | comfyui
    base_url: http://127.0.0.1:7860
    timeout: 180

audio:
  backend: dsp                     # sfx/music: dsp | local | stable3 | none
  cache_dir: output/audio_cache
  # NPC dialog speech synthesis (separate from `backend`).
  #   kokoro — Kokoro-82M (~330 MB, Apache-2.0), CPU or any GPU. Default.
  #   higgs  — Higgs Audio v2: needs ~11 GB VRAM, does NOT fit an 8 GB card.
  #   none   — dialog stays text-only.
  # Install once: pip install kokoro soundfile
  tts_backend: kokoro

logging:
  level: INFO
  show_prompts: false
